name: ci
on:
  push:
    paths: ["tools/**", "analytics/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["tools/**", "analytics/**", ".github/workflows/ci.yml"]

jobs:
  checkin:
    name: tools/checkin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "tools/checkin/tests/*.test.js"

  analytics:
    name: analytics/genz-capstone
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics/genz-capstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/genz-capstone/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
