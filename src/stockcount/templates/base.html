<!doctype html>
<html lang="th">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
{% include "_map.css" %}
</style>
<link rel="stylesheet" href="/static/app.css">
{% block head %}{% endblock %}
</head>
<body>
{% if nav is defined and nav %}

</nav>
{% endif %}

</html>
